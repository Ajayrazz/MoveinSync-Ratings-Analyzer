name: Automate Play Store Scraper

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering from the GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-play-scraper pandas

      - name: Run Scraper
        run: python scrape_reviews.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add moveinsync_reviews.csv
          # Only commit if the CSV actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated update of Play Store reviews" && git push)
